name: Compute Supply Risk Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute-supply-risk:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Supply risk számítás
        run: python scripts/compute_supply_risk.py

      - name: Változások mentése
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/supply-risk-intelligence.json docs/data/supply-risk-intelligence-status.json
          git commit -m "Compute supply risk intelligence" || echo "Nincs változás"
          git push
