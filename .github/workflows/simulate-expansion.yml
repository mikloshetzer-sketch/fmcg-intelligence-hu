name: Simulate Expansion Scenarios

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate-expansion:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Expansion szimuláció futtatása
        run: python scripts/simulate_expansion.py

      - name: Változások mentése
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/expansion-simulation.json docs/data/expansion-simulation-status.json
          git commit -m "Simulate expansion scenarios" || echo "Nincs változás"
          git push
