name: Update Price Intelligence

on:

  workflow_dispatch:

  schedule:

    - cron: "0 4 * * *"

permissions:

  contents: write

jobs:

  update-price-intelligence:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Upgrade pip

        run: |

          python -m pip install --upgrade pip

      - name: Run Price Intelligence

        env:

          ARFIGYELO_CATEGORY_IDS: "2046"

        run: |

          python scripts/update-price-intelligence.py

      - name: Commit data updates

        run: |

          git config user.name github-actions

          git config user.email github-actions@github.com

          git add docs/data/

          git commit -m "Automated Price Intelligence update" || echo "No changes"

          git push
