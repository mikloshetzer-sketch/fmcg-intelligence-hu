name: Update Consumer Narratives

on:
  workflow_dispatch:

  schedule:
    - cron: "5 7 * * 1"

permissions:
  contents: write

jobs:
  update-consumer-narratives:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Consumer Narratives frissítése
        run: python scripts/update_consumer_narratives.py

      - name: Változások mentése
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/consumer-narratives.json
          git commit -m "Update consumer narratives" || echo "No changes"
          git push
