name: Discover GVH Categories

on:

  workflow_dispatch:

permissions:

  contents: write

jobs:

  discover-categories:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Run discovery

        run: |

          python scripts/discover-arfigyelo-categories.py

      - name: Commit results

        run: |

          git config user.name github-actions

          git config user.email github-actions@github.com

          git add docs/data/arfigyelo-category-discovery.json

          git commit -m "Discover GVH categories" || echo "No changes"

          git push
