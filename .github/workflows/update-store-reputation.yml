name: Update FMCG Store Reputation

on:
  workflow_dispatch:

  schedule:
    - cron: "45 */12 * * *"

permissions:
  contents: write

jobs:
  update-store-reputation:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Store reputation script futtatása
        run: python scripts/update_store_reputation.py

      - name: Változások mentése
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/store-profiles.json docs/data/store-reputation.json docs/data/store-reputation-status.json docs/data/store-reputation-history-2026.json
          git commit -m "Update FMCG store reputation data" || echo "Nincs változás"
          git push
