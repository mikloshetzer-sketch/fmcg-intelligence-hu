name: Salary Dashboard Builder

on:
  workflow_dispatch:

  schedule:
    - cron: '40 5 * * 1'

permissions:
  contents: write

jobs:
  build-salary-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build salary summary
        run: |
          python scripts/update_salary_summary.py

      - name: Build verified salary data
        run: |
          python scripts/update_salary_verified_data.py

      - name: Build salary dashboard data
        run: |
          python scripts/update_salary_dashboard_data.py

      - name: Commit generated salary dashboard data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add docs/data/salary-summary.json
          git add docs/data/salary-role-summary.json
          git add docs/data/salary-verified-data.json
          git add docs/data/salary-dashboard-data.json

          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Build salary dashboard data"
          )

          git push
