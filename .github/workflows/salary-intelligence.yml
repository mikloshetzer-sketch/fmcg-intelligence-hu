
name: FMCG Salary Intelligence

on:

  workflow_dispatch:

  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: write

jobs:

  salary_intelligence:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.12'

      - name: Display Python version
        run: python --version

      - name: Create docs/data directory
        run: mkdir -p docs/data

      - name: Run salary intelligence collector
        run: |
          python scripts/update_salary_intelligence.py

      - name: Run salary summary builder
        run: |
          python scripts/update_salary_summary.py

      - name: Verify generated files
        run: |
          ls -la docs/data

      - name: Commit updated files
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/salary-raw-data.json

          git add docs/data/salary-summary.json

          git add docs/data/salary-role-summary.json

          git diff --cached --quiet || git commit -m "Update FMCG salary intelligence"

          git push
