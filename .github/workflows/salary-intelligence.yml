name: Salary Intelligence

on:

  workflow_dispatch:

  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: write

jobs:

  salary_intelligence:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5

        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          pip install requests

      - name: Generate salary intelligence
        run: |
          python scripts/update_salary_intelligence.py

      - name: Commit changes
        run: |

          git config --global user.name github-actions

          git config --global user.email github-actions@github.com

          git add docs/data/salary-intelligence.json

          git diff --cached --quiet || git commit -m "Update salary intelligence"

          git push
