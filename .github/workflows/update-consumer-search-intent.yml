name: Update Consumer Search Intent

on:
  workflow_dispatch:

  schedule:
    - cron: "45 6 * * 1"

permissions:
  contents: write

jobs:
  update-consumer-search-intent:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install requests
          pip install "urllib3<2"
          pip install pytrends==4.9.2

      - name: Consumer Search Intent frissítése
        run: python scripts/update_consumer_search_intent.py

      - name: Változások mentése
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/consumer-search-intent.json
          git commit -m "Update consumer search intent data" || echo "No changes"
          git push
