name: Update FMCG Human Capital Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

jobs:
  update-human-capital:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Jobs monitor futtatása
        run: |
          python scripts/update_jobs.py

      - name: Ellenőrzés
        run: |
          ls -la docs/data/

      - name: Git beállítás
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fájlok commitolása
        run: |
          git add docs/data/jobs.json
          git add docs/data/job-postings-current.json
          git add docs/data/employer-reviews.json
          git add docs/data/benefits.json
          git add docs/data/jobs-monitor-status.json
          git add docs/data/jobs-history/
          git add docs/data/jobs-raw/

          git diff --cached --quiet || git commit -m "Automated Human Capital update"

      - name: Push
        run: |
          git push
