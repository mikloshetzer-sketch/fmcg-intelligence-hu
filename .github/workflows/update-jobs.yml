name: Update FMCG Jobs History

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Jobs snapshot generálása
        run: python scripts/update_jobs.py

      - name: Változások commitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/jobs-history/
          git add docs/data/jobs-monitor-status.json

          git diff --cached --quiet || git commit -m "Automated jobs snapshot update"

      - name: Push
        run: |
          git push
