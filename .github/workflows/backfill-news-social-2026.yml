name: Backfill News Social 2026

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill-news-social-2026:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Historical backfill futtatása
        run: |
          python scripts/backfill_news_social_2026.py

      - name: Ellenőrzés
        run: |
          ls -la docs/data/
          test -f docs/data/news-social-history-2026.json
          test -f docs/data/news-social-history-2026-status.json

      - name: Git beállítás
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fájlok commitolása
        run: |
          git add docs/data/news-social-history-2026.json
          git add docs/data/news-social-history-2026-status.json
          git diff --cached --quiet || git commit -m "Backfill News Social 2026 history"

      - name: Push
        run: |
          git push
