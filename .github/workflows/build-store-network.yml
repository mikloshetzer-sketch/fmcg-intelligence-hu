name: Build FMCG Store Network

on:
  workflow_dispatch:

  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: write

jobs:
  build-store-network:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Országos bolthálózat építése
        run: python scripts/build_store_network.py

      - name: Változások mentése
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/store-network-hu.json docs/data/store-network-hu-status.json
          git commit -m "Build national FMCG store network" || echo "Nincs változás"
          git push
