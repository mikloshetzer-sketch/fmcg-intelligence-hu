name: Update FMCG Social Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

jobs:
  update-social-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Social monitor script futtatása
        run: python scripts/update_social_monitor.py

      - name: Változások mentése
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/social-monitor.json docs/data/social-monitor-status.json
          git commit -m "Update FMCG social monitor data" || echo "Nincs változás"
          git push
